services:
  db:
    image: postgres:16-alpine
    container_name: reloop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reloop}
      POSTGRES_DB: ${POSTGRES_DB:-reloop}
    volumes:
      - reloop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-reloop} -d $${POSTGRES_DB:-reloop}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: reloop-db-migrate
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reloop}:${POSTGRES_PASSWORD:-reloop}@db:5432/${POSTGRES_DB:-reloop}?schema=public
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-to-a-long-random-string}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      AUDIT_CHECKSUM_SECRET: ${AUDIT_CHECKSUM_SECRET:-audit-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  realtime:
    build:
      context: .
      dockerfile: Dockerfile.realtime
    container_name: reloop-realtime
    restart: unless-stopped
    environment:
      REALTIME_PORT: "3001"
      REALTIME_HOST: "0.0.0.0"
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-reloop-dev-realtime-secret}
      # Must match the web service's secret: the gateway verifies the same
      # reloop_session cookie to decide whether a socket may receive
      # security-alert broadcasts.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-to-a-long-random-string}
      REALTIME_WS_SESSION_URL: http://web:3000/api/internal/ws-session
    # No host port exposed - proxied through Nginx internally
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reloop-web
    restart: unless-stopped
    # No host port exposed - proxied through Nginx internally
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reloop}:${POSTGRES_PASSWORD:-reloop}@db:5432/${POSTGRES_DB:-reloop}?schema=public
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-to-a-long-random-string}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      AUDIT_CHECKSUM_SECRET: ${AUDIT_CHECKSUM_SECRET:-audit-secret-change-me}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ReLoop}
      # Required: the public URL browsers use (e.g. https://reloop.example; for
      # this stack's own nginx locally, http://localhost:8111). It is the only
      # Origin the proxy accepts for signed-in browser writes and the only base
      # for emailed links. Deliberately no localhost default: when unset the
      # app fails closed (browser writes 403, email endpoints 503) and logs
      # "NEXT_PUBLIC_BASE_URL is not configured or invalid". Not `:?`, which
      # would abort every compose command (incl. the README's local
      # `docker compose up -d` for the database) before a .env exists.
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-reloop-dev-realtime-secret}
      REALTIME_PUBLISH_URL: http://realtime:3001/publish
      NEXT_PUBLIC_REALTIME_WS_URL: ${NEXT_PUBLIC_REALTIME_WS_URL:-ws://localhost:3001/ws}
      TRUST_PROXY: "true"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: reloop-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  nginx:
    image: nginx:1.25-alpine
    container_name: reloop-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8111:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - realtime
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

volumes:
  reloop-db-data:
