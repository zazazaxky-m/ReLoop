name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  NODE_VERSION: "20"

# Security scanners live in security-scan.yml (Semgrep, CodeQL, Trivy, …)
# and run on the same PR/push events in parallel.

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Audit regression harness. Every job below uses only per-run, test-only
  # values generated by scripts/run-audit-tests.mjs: an ephemeral Compose
  # project (PostgreSQL 16 + Redis 7 on Docker-allocated loopback ports),
  # random secrets, a fake mail/push sink. No repository secrets, no
  # production URLs. The runner redacts logs and sanitizes test-results/ before
  # anything below is uploaded; traces/HAR/storage state are never produced.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (real PostgreSQL/Redis/Next)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Integration suite
        run: npm run test:integration

      - name: Upload redacted logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: test-results/audit/*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  realtime:
    name: Realtime gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Realtime suite
        run: npm run test:realtime

      - name: Upload redacted logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-logs
          path: test-results/audit/*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser (360/768/1280, light/dark)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser suite
        run: npm run test:browser

      - name: Upload screenshots and redacted logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: |
            test-results/audit/*/screenshots/
            test-results/audit/*/logs/*.log
            test-results/audit/*/playwright-output/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  rvm-python:
    name: RVM Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rvm/requirements.txt

      # Fresh temporary venv + rvm/requirements.txt, then tests/test_rvm*.py.
      - name: RVM suite
        run: npm run test:rvm

      - name: Upload redacted logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rvm-logs
          path: test-results/audit/*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  flutter:
    name: Flutter (unit/widget/contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3.41.7 is the stable SDK recorded in mobile/.metadata (Dart 3.11.5,
      # satisfying mobile/pubspec.yaml `sdk: ^3.11.5`). Device-based
      # mobile/integration_test/ needs an emulator job and is not run here.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: flutter test (from mobile/)
        run: npm run test:flutter

  build:
    name: Build
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            public/
            node_modules/
            package.json
            next.config.ts
          retention-days: 3
